# The product configuration a PICTURE comparison against the console reference requires.
#
# picture.py photographs the product and the Beetle full-console reference at the same title-owned
# state and counts differing pixels. The reference is a PSX: 4:3, one presented frame per guest
# frame. Both port enhancements change the frame the product hands the comparator, and neither
# change is title-specific, which is why this file lives with the comparator rather than in each
# game:
#
#   aspect=3 renders the wider viewport, so the product presents a DIFFERENT SIZE and the
#     comparison refuses rather than scale one onto the other (scaling would invent the pixels it
#     then measured). Widescreen is a STATE question and is answered by compare.py, which reads the
#     same declared ranges with it off and on.
#   fps60=1 presents interpolated frames between guest updates, so the shutter can land on a frame
#     that corresponds to no guest state and the console never produced.
#
# So this is not "the enhancements switched off to make a number look good": it is the only
# configuration in which the pixel question is answerable at all. Each game's own shipping settings
# file stays the configuration everything else runs under.
aspect=0
fps60=0
