name: Title release

# Called by a title's release workflow: builds its AppImage in the Ubuntu 22.04 container
# (tools/port/appimage_container.py), its Windows archive with llvm-mingw (tools/port/windows_package.py) and
# its macOS app on an Intel Mac (tools/port/macos_package.py), and publishes them on the title's GitHub release.
# tools/port/publish_release.py builds the first two locally and asks this only for macos.
on:
  workflow_call:
    inputs:
      product:
        description: The title's port target, e.g. tomba2_port
        required: true
        type: string
      tag:
        description: Release tag; defaults to the pushed tag
        required: false
        type: string
      platforms:
        description: The packages to build, space-separated from linux, windows and macos
        required: false
        type: string
        default: linux windows macos

permissions:
  contents: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the release when it does not exist
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
                 --title "${RELEASE_TAG}" --notes "Bring your own disc: the first-run screen asks for it."

  linux-appimage:
    name: Linux AppImage (x86-64)
    needs: release
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the title with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
      - name: Resolve the framework
        run: uv run --no-project https://raw.githubusercontent.com/SomeoneIsWorking/psxport/main/tools/psxport_fetch.py --auto
      - name: Build and package the AppImage in the Ubuntu 22.04 container
        run: >-
          uv run --frozen python external/psxport/tools/port/appimage_container.py --engine docker
          --product "${{ inputs.product }}" --version "${RELEASE_TAG}"
      - name: Publish the AppImage and its update file
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber
          build/release/*.AppImage build/release/*.AppImage.zsync

  windows:
    name: Windows (x86-64)
    needs: release
    if: contains(inputs.platforms, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the title with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
      - name: Resolve the framework
        run: uv run --no-project https://raw.githubusercontent.com/SomeoneIsWorking/psxport/main/tools/psxport_fetch.py --auto
      - name: Install the build host's tools
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          autoconf automake libtool make texinfo ninja-build glslc
      - name: Check out the pinned Lightrec
        run: uv run --no-project python external/psxport/tools/psxport_fetch.py --lightrec
      - name: Cross-compile with llvm-mingw
        run: uv run --frozen python external/psxport/tools/port/consumer_build.py --platform windows --target "${{ inputs.product }}"
      - name: Package the archive
        run: >-
          uv run --frozen python external/psxport/tools/port/windows_package.py
          --binary "build/windows/bin/${{ inputs.product }}.exe" --version "${RELEASE_TAG}" --output build/release
      - name: Publish the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber build/release/*-windows-x86_64.zip

  macos:
    name: macOS (x86-64)
    needs: release
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the title with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
      - name: Resolve the framework
        run: uv run --no-project https://raw.githubusercontent.com/SomeoneIsWorking/psxport/main/tools/psxport_fetch.py --auto
      - name: Install the build host's tools
        run: |
          brew install autoconf automake libtool texinfo ninja shaderc
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check out the pinned Lightrec
        run: uv run --no-project python external/psxport/tools/psxport_fetch.py --lightrec
      - name: Build against the macOS target libraries
        run: uv run --frozen python external/psxport/tools/port/consumer_build.py --platform macos --target "${{ inputs.product }}"
      - name: Package the app
        run: >-
          uv run --frozen python external/psxport/tools/port/macos_package.py
          --binary "build/macos/bin/${{ inputs.product }}" --version "${RELEASE_TAG}" --output build/release
      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber build/release/*-macos-x86_64.zip
